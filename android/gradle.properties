org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
# Built-in Kotlin stays off until every plugin builds with it: share_plus and
# device_info_plus need win32 6 for that, which file_picker 11 doesn't allow,
# and file_picker 12+ changes its whole API. Until then the Kotlin Gradle
# Plugin compiles Kotlin, and Flutter warns about it on every build.
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
